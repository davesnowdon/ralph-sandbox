services:
  ralph:
    build: &sandbox_build
      context: .
      # Variant-selectable (set by bin/ralph-sandbox --variant). Defaults to python.
      dockerfile: ${SANDBOX_DOCKERFILE:-dockerfiles/python/Dockerfile}
      args:
        NODE_MAJOR: "20"
        # Pin if you want repeatability (recommended): set to a commit SHA
        # RALPH_REF: "a1b2c3d4..."
        RALPH_REF: "6c53cb0"
        RALPH_UID: "${UID:-1000}"
        RALPH_GID: "${RALPH_GID:-1000}"
        # Consumed only by dockerfiles/python-ui/Dockerfile (the image it layers
        # FROM). Null-form passthrough on purpose: when $BASE_IMAGE is unset the
        # arg is NOT passed and the Dockerfile default — the published
        # docker.io/davesnowdon/ralph-sandbox:python — applies, so
        # `bin/ralph-sandbox --variant python-ui --build` works on a clean host.
        # Set BASE_IMAGE=ralph-sandbox:python-test to layer on a locally built
        # base (what the Makefile does). Ignored by the other variants.
        BASE_IMAGE:

    image: ${SANDBOX_IMAGE:-ralph-sandbox:python}

    init: true
    # Chromium in the python-ui variant needs more than Docker's default 64MB
    # /dev/shm under real e2e load. A bounded shm_size (not ipc:host — this is a
    # hardened sandbox) covers it; harmless for the other variants.
    shm_size: 1gb
    working_dir: ${PROJECT_DIR:?Set PROJECT_DIR to an absolute path}

    volumes:
      - type: bind
        source: ${PROJECT_DIR:?Set PROJECT_DIR to an absolute path}
        target: ${PROJECT_DIR:?Set PROJECT_DIR to an absolute path}

    environment:
      - PROJECT_DIR=${PROJECT_DIR:?Set PROJECT_DIR to an absolute path}
      - RALPH_TOOL=${RALPH_TOOL:-claude}
      - SESSION_RUNNER=${SESSION_RUNNER:-}
      - RALPH_PROMPT_FILE=${RALPH_PROMPT_FILE:-}
      - CLAUDE_CONFIG_DIR=/claude_config
      - CODEX_CONFIG_DIR=/codex_config
      - CROSS_TOOLCHAIN_DIR=${CROSS_TOOLCHAIN_DIR:-}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    restart: "no"

  ralph-login:
    # Shares the ralph service's variant-selectable build so `--service
    # ralph-login --variant <v> --build` can build the image itself.
    build: *sandbox_build
    image: ${SANDBOX_IMAGE:-ralph-sandbox:python}
    init: true
    shm_size: 1gb
    entrypoint: ["/bin/bash"]
    working_dir: ${PROJECT_DIR:?Set PROJECT_DIR to an absolute path}
    volumes:
      - type: bind
        source: ${PROJECT_DIR:?Set PROJECT_DIR to an absolute path}
        target: ${PROJECT_DIR:?Set PROJECT_DIR to an absolute path}
    environment:
      - PROJECT_DIR=${PROJECT_DIR:?Set PROJECT_DIR to an absolute path}
      - RALPH_TOOL=${RALPH_TOOL:-claude}
      - SESSION_RUNNER=${SESSION_RUNNER:-}
      - RALPH_PROMPT_FILE=${RALPH_PROMPT_FILE:-}
      - CLAUDE_CONFIG_DIR=/claude_config
      - CODEX_CONFIG_DIR=/codex_config
      - CROSS_TOOLCHAIN_DIR=${CROSS_TOOLCHAIN_DIR:-}
