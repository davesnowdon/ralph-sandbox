name: Docker Image

on:
  pull_request:
    paths:
      - 'dockerfiles/python/**'
      - 'dockerfiles/python-ui/**'
      - 'dockerfiles/common/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'bin/ralph-sandbox'
      - '.github/workflows/publish-python.yml'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Digest of the pushed python release image; the python-ui job layers on
      # it by digest so the chained build cannot race a mutable tag.
      digest: ${{ steps.release-build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build validation image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/python/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build and push release image
        if: github.event_name == 'release'
        id: release-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/python/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            davesnowdon/ralph-sandbox:python
            davesnowdon/ralph-sandbox:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # python-ui layers FROM the python image, so it lives in the python workflow
  # as a chained job rather than a standalone publish workflow: a clean Buildx
  # runner cannot see a local python build, so the release build pins the
  # just-pushed base by digest, and the PR validation build exercises the
  # Dockerfile's published-base default (the clean-host contract).
  build-ui:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build validation image (python-ui)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/python-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Build and push release image (python-ui)
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/python-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=davesnowdon/ralph-sandbox:python@${{ needs.build.outputs.digest }}
          tags: |
            davesnowdon/ralph-sandbox:python-ui
            davesnowdon/ralph-sandbox:python-ui-${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
