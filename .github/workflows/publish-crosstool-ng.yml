name: Docker Image (crosstool-ng)

on:
  pull_request:
    paths:
      - 'dockerfiles/crosstool-ng/**'
      - 'dockerfiles/common/**'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'bin/ralph-sandbox'
      - '.github/workflows/publish-crosstool-ng.yml'
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build validation image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/crosstool-ng/Dockerfile
          # amd64 only for PR validation: the arm64 leg compiles crosstool-ng
          # under QEMU emulation, which is prohibitively slow. The release build
          # below still produces both architectures.
          platforms: linux/amd64
          push: false

      - name: Build and push release image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/crosstool-ng/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            davesnowdon/ralph-sandbox:crosstool-ng
            davesnowdon/ralph-sandbox:crosstool-ng-${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
