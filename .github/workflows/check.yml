name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # python-ui is clean-runner-safe: `make check VARIANT=python-ui` builds
        # the python base from the checkout first and layers on it via
        # --build-arg BASE_IMAGE=ralph-sandbox:python-test.
        variant: [python, python-ui, crosstool-ng, cpp]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          sudo curl -sS -L -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          sudo chmod +x /usr/local/bin/shfmt

      - name: Run checks
        run: make check VARIANT=${{ matrix.variant }}
